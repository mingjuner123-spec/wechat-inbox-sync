name: Mirror Douyin resolver

on:
  workflow_dispatch:
  schedule:
    # Upstream polling is server-side. Clients still check the CDN at most once per 48 hours.
    - cron: '17 */12 * * *'

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TCB_ENV_ID: he02-d8gebzv050ed6c4ef-d350b93bf
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli
      - name: Authenticate CloudBase static hosting deployer
        run: tcb login --cloudbase-api-key "${{ secrets.WECHAT_INBOX_TCB_API_KEY }}" -e "$TCB_ENV_ID"
      - name: Mirror verified upstream yt-dlp binaries
        run: node scripts/sync-douyin-resolver-mirror.js --execute --env "$TCB_ENV_ID"
